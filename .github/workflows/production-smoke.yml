name: Production Smoke

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_SMOKE_WEB_URL: https://voxaria.io
      PRODUCTION_SMOKE_API_URL: https://api.voxaria.io
      PRODUCTION_SMOKE_ATTEMPTS: 12
      PRODUCTION_SMOKE_DELAY_MS: 30000
      VOXARIA_SMOKE_USERNAME: ${{ secrets.VOXARIA_SMOKE_USERNAME }}
      VOXARIA_SMOKE_PASSWORD: ${{ secrets.VOXARIA_SMOKE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run production smoke test
        run: npm run smoke:prod
